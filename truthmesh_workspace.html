<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">

  <title>TRUTHMESH — Follow the evidence</title>
  <style>
    :root {
      --paper: #f7f5ef;
      --white: #fffefa;
      --ink: #222923;
      --muted: #697169;
      --line: #deded4;
      --green: #275a45;
      --green2: #e7eee7;
      --teal: #176b61;
      --teal-soft: #e4f0ed;
      --navy: #182d35;
      --orange: #b85b35;
      --yellow: #f1dca6;
      --shadow: 0 12px 32px rgba(32, 37, 27, 0.08);
      --serif: Georgia, 'Times New Roman', Cambria, serif;
      --sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .shell {
      max-width: 1440px;
      margin: auto;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
    }
    aside {
      padding: 27px 18px 20px 24px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f4f2eb;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 28px 2px;
      cursor: pointer;
    }
    .brandmark {
      height: 36px;
      width: 36px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green);
      font: 20px var(--serif);
      font-weight: 700;
      background: var(--white);
    }
    .brandname {
      font-size: 16px;
      letter-spacing: .12em;
      font-weight: 800;
      line-height: 1.2;
    }
    .brandname small {
      display: block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--muted);
      margin-top: 4px;
    }
    .navlabel {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      color: #8b8e83;
      margin: 12px 0 6px 10px;
      text-transform: uppercase;
    }
    .nav { display: grid; gap: 3px; }
    .nav button {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 9px 12px;
      border-radius: 7px;
      color: #555f56;
      display: flex;
      gap: 11px;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav button:hover { background: #e9e9df; color: var(--ink); }
    .nav button.active { background: var(--green); color: white; font-weight: 600; }
    .nav .ico { font-size: 15px; width: 20px; text-align: center; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 64px;
      border-bottom: 1px solid var(--line);
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .crumb { font-size: 13px; font-weight: 600; }
    .crumb span { color: #b0b2a8; padding: 0 6px; }
    .topright { display: flex; align-items: center; gap: 10px; }
    .demo-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      background: #e7eee7;
      color: var(--green);
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    .content { padding: 24px 32px 60px; }
    .btn {
      border: 1px solid var(--line);
      background: var(--white);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #f0f0e8; }
    .btn.primary {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .btn.primary:hover { background: #1e4535; }
    .btn.sm { padding: 5px 10px; font-size: 11px; }
    .story-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 18px 0 26px;
    }
    .story {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 16px 18px;
    }
    .story small {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: .05em;
    }
    .story strong {
      font: 26px/1.2 var(--serif);
      display: block;
      margin: 4px 0 2px;
    }
    .story strong.warn { color: var(--orange); }
    .story strong.good { color: var(--green); }
    .story p { font-size: 11px; color: var(--muted); margin: 0; }
    .claims-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .claim-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s;
    }
    .claim-card:hover { border-color: #b8bcb4; }
    .tag {
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag.under_review, .tag.pending { background: #fef3d6; color: #8c6314; }
    .tag.disputed, .tag.altered { background: #fbeae6; color: var(--orange); }
    .tag.corroborated, .tag.verified { background: #e3eee9; color: var(--green); }
    .tag.inconclusive { background: #edece6; color: #5a645b; }
    .module {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .module h2 { font: 23px var(--serif); font-weight: 600; margin: 0 0 6px; }
    .module p { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .checklist { display: grid; gap: 9px; }
    .checkrow {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 13px;
      background: #f7f6f1;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
    }
    .checkrow input { margin-top: 2px; }
    .control {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 12px;
      background: white;
      font-size: 13px;
    }
    .control:focus { outline: 2px solid var(--green); border-color: transparent; }
    .modalback {
      position: fixed;
      inset: 0;
      background: rgba(34, 41, 35, 0.55);
      backdrop-filter: blur(2px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }
    .modal {
      background: var(--white);
      border-radius: 10px;
      width: 100%;
      max-width: 660px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 24px;
      position: relative;
    }
    .modalhead {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }
    .modalhead h2 { font: 24px var(--serif); margin: 4px 0 0; }
    .xbtn {
      border: 0;
      background: transparent;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .detailbox {
      padding: 14px;
      background: #f4f3ec;
      border-radius: 7px;
      margin-top: 12px;
      border: 1px solid var(--line);
    }
    .detailbox h4 {
      margin: 0 0 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink);
    }
    .detailbox p { font-size: 12px; margin: 0; color: #586358; }
    .dropzone {
      border: 2px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      background: #faf9f5;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dropzone:hover { border-color: var(--green); background: #f2f7f4; }
    .hashcode {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      background: #eef2ec;
      color: var(--navy);
      padding: 6px 10px;
      border-radius: 5px;
      word-break: break-all;
      display: inline-block;
      border: 1px solid #d4ddd2;
    }
    .table-dossier {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .table-dossier th {
      text-align: left;
      padding: 10px 12px;
      background: #f0f0e8;
      border-bottom: 2px solid var(--line);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }
    .table-dossier td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    /* Judge Walkthrough Bar */
    .judge-bar {
      background: #edf3ee;
      border-bottom: 1.5px solid #d4ded1;
      padding: 10px 28px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    /* Floating AI Copilot Widget */
    .copilot-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 90;
    }
    .copilot-btn {
      background: var(--green);
      color: white;
      border: 2px solid white;
      border-radius: 30px;
      padding: 12px 20px;
      box-shadow: 0 8px 24px rgba(39, 90, 69, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .copilot-window {
      width: 400px;
      max-width: calc(100vw - 32px);
      height: 540px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(32, 37, 27, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media print {
      aside, .top, .judge-bar, .copilot-float, .no-print, button { display: none !important; }
      .shell { display: block !important; }
      body { background: white !important; font-size: 11pt !important; }
      .module, .story, .claim-card { border: 1px solid #999 !important; box-shadow: none !important; break-inside: avoid; }
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      aside { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .claims-grid, .story-strip, .module-grid { grid-template-columns: 1fr; }
    }
  </style>

    function renderAddClaimModal() {

    // Navigation and Action Handlers
    function navigate(p) { activePage = p; render(); }
    function setFilter(f) { currentFilter = f; render(); }
    function handleSearch(q) { currentSearch = q; render(); }
    function openClaim(id) { selectedClaim = claims.find(c => c.id === id); render(); }
    function closeClaim() { selectedClaim = null; render(); }
    function openReceipt() { showReceipt = true; render(); }
    function closeReceipt() { showReceipt = false; render(); }
    function openAddClaim() { showAddClaimModal = true; render(); }
    function closeAddClaim() { showAddClaimModal = false; render(); }

    function openStealth(evId) {
      if (!selectedClaim) return;
      showStealthDiff = selectedClaim.evidence.find(e => e.id === evId);
      render();
    }
    function closeStealth() { showStealthDiff = null; render(); }

    function toggleChecklistItem(idx) {
      checklist[idx] = !checklist[idx];
      try { localStorage.setItem('tm-desk-check', JSON.stringify(checklist)); } catch(e) {}
      render();
    }

    function setBrightness(v) {
      mediaBrightness = v;
      const c = document.getElementById('forensicCanvas');
      if (c) c.style.filter = `contrast(${mediaContrast}%) brightness(${mediaBrightness}%)`;
    }

    function setContrast(v) {
      mediaContrast = v;
      const c = document.getElementById('forensicCanvas');
      if (c) c.style.filter = `contrast(${mediaContrast}%) brightness(${mediaBrightness}%)`;
    }

    function resetMediaFilters() {
      mediaBrightness = 100;
      mediaContrast = 100;
      render();
    }

    function drawSampleForensicCanvas() {
      const canvas = document.getElementById('forensicCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1e2820';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#2d3a30';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      ctx.fillStyle = '#e7eee7';
      ctx.font = '16px Georgia, serif';
      ctx.fillText('TRUTHMESH Forensic Noise Analysis Target', 30, 45);

      ctx.fillStyle = '#a6b8a8';
      ctx.font = '11px monospace';
      ctx.fillText('Channel: RGB [24-bit] · Color Temp: 5200K · Lens: 28mm f/2.8', 30, 75);

      ctx.fillStyle = '#275a45';
      ctx.fillRect(30, 100, 180, 110);
      ctx.fillStyle = '#fff';
      ctx.font = '13px sans-serif';
      ctx.fillText('Pixel Region A', 45, 130);
      ctx.font = '10px monospace';
      ctx.fillText('Noise variance: 0.012', 45, 155);
      ctx.fillText('Status: Intact', 45, 175);

      ctx.fillStyle = '#b85b35';
      ctx.fillRect(240, 100, 180, 110);
      ctx.fillStyle = '#fff';
      ctx.font = '13px sans-serif';
      ctx.fillText('Pixel Region B (Altered)', 255, 130);
      ctx.font = '10px monospace';
      ctx.fillText('Noise variance: 0.089', 255, 155);
      ctx.fillText('Status: Spliced patch', 255, 175);
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('forensicCanvas');
          if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = 460;
            canvas.height = Math.round(460 * (img.height / img.width));
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleCryptoFile(file) {
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        lastHashedFile = {
          name: file.name,
          size: file.size.toLocaleString(),
          sha256: `sha256:${hashHex}`
        };
        render();
      } catch(err) {
        alert('Could not compute file hash: ' + err.message);
      }
    }

    function handleFileDrop(e) {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleCryptoFile(e.dataTransfer.files[0]);
      }
    }

    function handleCreateClaim(e) {
      e.preventDefault();
      const title = document.getElementById('fTitle').value;
      const category = document.getElementById('fCategory').value;
      const summary = document.getElementById('fSummary').value;
      const verdict = document.getElementById('fVerdict').value;

      const newId = `TM-00${claims.length + 1}`;
      const fakeHash = 'sha256:' + Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');

      const newClaim = {
        id: newId,
        title,
        category,
        confidence: 75,
        hash: fakeHash,
        verdict,
        platform: 'Direct submission',
        stage: 'intake_triage',
        assignedTo: 'Desk Editor (Assigned)',
        summary,
        publicSummary: summary,
        evidence: [],
        reviewers: ['Desk Editor (Pending)'],
        corrections: [],
        history: ['Claim created manually']
      };

      claims.unshift(newClaim);
      saveClaims();
      closeAddClaim();
    }

    function downloadCaseManifest() {
      const data = {
        product: 'TRUTHMESH',
        version: '2.0-standalone',
        exportedAt: new Date().toISOString(),
        standards: ['Meedan Check', 'ConvergePanel', 'ProofAnchor', 'JTI'],
        claims
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      triggerBlobDownload(blob, 'truthmesh-manifest.json');
    }

    function downloadReceiptJson(id) {
      const c = claims.find(x => x.id === id);
      if (!c) return;
      const data = {
        receiptId: `RCP-2026-${c.id}`,
        title: c.title,
        hash: c.hash,
        verdict: c.verdict,
        certifiedAt: new Date().toISOString(),
        admissibility: 'ISO/IEC 27037 Certified'
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      triggerBlobDownload(blob, `receipt-${c.id}.json`);
    }

    function downloadStandaloneFile() {
      const htmlContent = '<!doctype html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      triggerBlobDownload(blob, 'truthmesh-standalone.html');
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (showStealthDiff) closeStealth();
        else if (showReceipt) closeReceipt();
        else if (selectedClaim) closeClaim();
        else if (showAddClaimModal) closeAddClaim();
        else if (showCopilot) toggleCopilot();
      }
    });

    render();
  </script>
